name: bdm

services:
  mongo_personas:
    image: mongo:7
    container_name: mongo_personas
    ports:
      - "27017:27017"
    volumes:
      - data_personas:/data/db
    networks: [bdm_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo_articulos:
    image: mongo:7
    container_name: mongo_articulos
    ports:
      - "27018:27017"
    volumes:
      - data_articulos:/data/db
    networks: [bdm_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo_ventas:
    image: mongo:7
    container_name: mongo_ventas
    ports:
      - "27019:27017"
    volumes:
      - data_ventas:/data/db
    networks: [bdm_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  relacional:
    image: postgres:16
    container_name: relacional
    environment:
      POSTGRES_USER: bdm
      POSTGRES_PASSWORD: bdm_pass
      POSTGRES_DB: almacen
    ports:
      - "5432:5432"
    volumes:
      - data_relacional:/var/lib/postgresql/data
    networks: [bdm_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdm -d almacen"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  bdm_net:
    name: bdm_net
    driver: bridge

volumes:
  data_personas:
  data_articulos:
  data_ventas:
  data_relacional:
