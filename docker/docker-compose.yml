services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: core_container
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
    depends_on:
      - mongo_personas
      - mongo_articulos
      - mongo_ventas
      - relacional

  mongo_personas:
    image: mongo:6.0
    container_name: mongo_personas
    ports:
      - "27018:27017"
    volumes:
      - mongo_personas_data:/data/db

  mongo_articulos:
    image: mongo:6.0
    container_name: mongo_articulos
    ports:
      - "27019:27017"
    volumes:
      - mongo_articulos_data:/data/db

  mongo_ventas:
    image: mongo:6.0
    container_name: mongo_ventas
    ports:
      - "27020:27017"
    volumes:
      - mongo_ventas_data:/data/db

  relacional:
    image: mariadb:11.4
    container_name: relacional
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-mariadb}
      MARIADB_DATABASE: almacen
      MARIADB_USER: app_user
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-mariadb}
    ports:
      - "3308:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mongo_personas_data:
  mongo_articulos_data:
  mongo_ventas_data:
  mariadb_data:
